global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend demo
    bind 127.0.0.1:18080
    acl main_api path_reg ^/api/records/v1/(main_ops|aux_ops)(/|$)
    acl auth_api path /api/auth/v1/login /api/auth/v1/logout /api/auth/v1/refresh
    acl status_a path /_hat/a
    acl status_b path /_hat/b
    acl home path /
    http-request deny deny_status 404 if !main_api !auth_api !status_a !status_b !home
    use_backend status_a if status_a
    use_backend status_b if status_b
    use_backend home if home
    default_backend writer

backend writer
    option httpchk GET /api/healthcheck
    server a 127.0.0.1:14000 check

backend home
    server a 127.0.0.1:14001 check

backend status_a
    http-request set-path /_hat/status
    server a 127.0.0.1:14001 check

backend status_b
    http-request set-path /_hat/status
    server b 127.0.0.1:14002 check
