[package]
name = "hat"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
